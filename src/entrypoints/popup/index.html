<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Organizer</title>
    <!--
      Critical first-paint CSS lives here on purpose. In `npm run dev`, Vite
      turns a <link> to style.css into a JS injection, so the popup paints as
      unstyled Times-on-white until the bundle runs (~2s). This block is in the
      HTML, so the chrome and spinner match the rest of the UI from the first
      frame. style.css still loads for everything else.
    -->
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        --accent: #0060df;
        --border: #cfcfd8;
        --muted: #5b5b66;
        --hover: #f0f0f4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #00ddff;
          --border: #3a3944;
          --muted: #bfbfc9;
          --hover: #52525e;
        }
      }
      html {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }
      body {
        margin: 0;
        width: 380px;
        background: Canvas;
        color: CanvasText;
      }
      .shell:has(#root:not(:empty)) #boot {
        display: none;
      }
      .head {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px 8px 10px 12px;
      }
      .head-text {
        flex: 1;
        min-width: 0;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
      }
      .tagline {
        font-size: 11px;
        color: var(--muted);
        margin: 1px 0 0;
      }
      .gear {
        width: 32px;
        height: 32px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 4px;
        color: inherit;
        cursor: pointer;
      }
      .gear:hover {
        background: var(--hover);
      }
      .busy {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 12px 26px;
      }
      .spinner {
        box-sizing: border-box;
        width: 16px;
        height: 16px;
        flex: none;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <!-- Header and spinner are HTML, not React. React does not mount until
           there is a real screen to paint, so createRoot never empties the
           popup down to a 1×1 frame. #boot hides once #root has content.
           The gear lives here so every state — including loading — can open
           options. -->
      <header class="head">
        <div class="head-text">
          <h1>Tab Organizer</h1>
          <p class="tagline">Nothing moves until you apply.</p>
        </div>
        <button type="button" id="options" class="gear" title="Options" aria-label="Options">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <circle cx="8" cy="8" r="2.4"></circle>
            <circle cx="8" cy="8" r="5.6" stroke-dasharray="2.2 2.2"></circle>
          </svg>
        </button>
      </header>
      <div id="boot" class="busy" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>Reading tabs…</span>
      </div>
      <div id="root"></div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
